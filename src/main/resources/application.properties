spring.application.name=book-amenities

# ===============================
# = MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/bookamenities?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = Hibernate / JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# = AWS Configuration
# ===============================
aws.region=ap-south-1
aws.access.key=YOUR_KEY
aws.secret.key=YOUR_SECRET

