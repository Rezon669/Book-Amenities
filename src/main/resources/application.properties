spring.application.name=book-amenities

# ===============================
# = MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/bookamenities?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = Hibernate / JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = AI Configuration
# ===============================

spring.ai.openai.api-key=${OPENAI_API_KEY}


# ===============================
# = PostgreSQL Database Configuration for RAG
# ===============================
rag.datasource.url=jdbc:postgresql://localhost:5432/bookamenities_rag_db
rag.datasource.username=${POSTGRES_DB_USERNAME}
rag.datasource.password=${POSTGRES_DB_PASSWORD}
rag.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = Hibernate / JPA Configuration
# ===============================
rag.jpa.hibernate.ddl-auto=update
rag.jpa.show-sql=false
rag.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
rag.jpa.properties.hibernate.format_sql=true

# ===============================
# = Vector DB Configuration
# ===============================
#vectorstore.pgvector.initialize-schema=true

spring.ai.vectorstore.pgvector.initialize-schema=true

